            "@type": "Question",
            "name": "How do I resize an image to 16:9 without stretching?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fix the ratio at 16:9, enter the width you want, and the height is width times 9 divided by 16. At 2560 wide the height is 1440. Enter the height instead to solve for the width."
            }
          },
          {
            "@type": "Question",
            "name": "What aspect ratio is 1920 by 1080?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "16:9. Both numbers divide by 120, giving 16 and 9. The decimal form is about 1.778 to 1."
            }
          },
          {
            "@type": "Question",
            "name": "What is 21:9 really?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ultrawide monitors marketed as 21:9 are usually 64:27, which is 16:9 stretched by another 16:9. 3440 by 1440 is a common 21:9 resolution."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between fit and fill?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fit scales a size down until the whole thing sits inside a box, possibly leaving bars on two sides. Fill scales up until the box is covered and crops the overflow. This calculator does fit, with no cropping."
            }
          }
        ]
